---
driver:
  name: proxy
  host: localhost
  reset_command: "exit 0"
  port: <%= ENV["machine_port"] %>
  username: <%= ENV["machine_user"] %>
  password: <%= ENV["machine_pass"] %>

# The proxy driver's own host/port/username/password (above) are injected into
# the transport only by Kitchen::Driver::SSHBase#backcompat_merged_state, which
# runs on the converge/verify path. `kitchen exec` (used by the CI "Habitat-
# backed second run" idempotency check) and lifecycle `remote:` hooks are NOT:
# both call instance.transport.connection directly with the raw state file, so
# an unconfigured ssh transport gets password: nil and either dies outright or
# — worse, on a non-TTY CI runner — crashes trying to interactively prompt for
# one (Errno::ENOTTY). Configure the (default ssh) transport explicitly here so
# every path has credentials; the windows-latest platform below does the same
# for winrm.
transport:
  username: <%= ENV["machine_user"] %>
  password: <%= ENV["machine_pass"] %>
  port: <%= ENV["machine_port"] %>

platforms:
  - name: localhost
    lifecycle:
      pre_converge:
        - remote: |
            if [ -x /opt/chef/bin/chef-client ]; then
              echo 'omnibus Chef Infra Client already present, skipping'
            else
              set -euo pipefail
              key='<%= ENV.fetch('CHEF_LICENSE_KEY', nil) %>'
              uri="https://chefdownload-commercial.chef.io/stable/chef/metadata?p=ubuntu&pv=24.04&m=x86_64&v=18&direct=true&license_id=$key"
              meta="$(curl -fsSL "$uri")"
              url="$(echo "$meta" | grep -o '"url":"[^"]*"' | cut -d'"' -f4)"
              deb=/tmp/chef-omnibus-18.deb
              curl -fsSL -o "$deb" "$url"
              sudo dpkg -i --force-conflicts "$deb"
              echo "installed omnibus Chef Infra Client"
            fi
  - name: windows-latest
    provisioner:
      chef_client_path: C:\opscode\chef\bin\chef-client.bat
    lifecycle:
      pre_converge:
        - remote: |
            if (Test-Path 'C:\opscode\chef\bin\chef-client.bat') {
              Write-Host 'omnibus Chef Infra Client already present, skipping'
            } else {
              $ErrorActionPreference = 'Stop'
              $ProgressPreference = 'SilentlyContinue'
              $key = '<%= ENV.fetch('CHEF_LICENSE_KEY', nil) %>'
              $uri = "https://chefdownload-commercial.chef.io/stable/chef/metadata?p=windows&pv=2019&m=x86_64&v=18&direct=true&license_id=$key"
              $meta = Invoke-RestMethod -UseBasicParsing -Uri $uri
              $msi = Join-Path $env:TEMP 'chef-omnibus-18.msi'
              Invoke-WebRequest -UseBasicParsing -Uri $meta.url -OutFile $msi
              $p = Start-Process msiexec -ArgumentList '/qn','/i',$msi -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "omnibus Chef install failed with exit code $($p.ExitCode)" }
              Write-Host "installed omnibus Chef Infra Client $($meta.version)"
            }
