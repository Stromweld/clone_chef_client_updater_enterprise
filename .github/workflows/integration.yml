---
"on":
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  HAB_LICENSE: accept-no-persist
  CHEF_LICENSE: accept-no-persist
  CHEF_LICENSE_KEY: ${{ vars.CHEF_LICENSE_KEY }}

jobs:
  integration:
    env:
      KITCHEN_LOCAL_YAML: kitchen.dokken.yml
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - almalinux-9
          - almalinux-10
          - ubuntu-2404
          - ubuntu-2604
        suite:
          - default
          - preserve-omnibus
          - multi-version
          - scheduler-fix
          - remove-omnibus
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: actionshub/chef-install@main
        with:
          license: ${{ vars.CHEF_LICENSE_KEY }}
          chefDownloadUrl: chefdownload-commercial.chef.io
          project: chef-workstation-enterprise
          version: latest
      - name: Kitchen Converge
        run: |
          kitchen converge ${{ matrix.suite }}-${{ matrix.os }}
      - name: Kitchen Converge again (idempotency check)
        # multi-version deliberately installs/prunes a different Habitat version on
        # every converge (see test/cookbooks/.../recipes/multi_version.rb) — it will
        # never be idempotent by design, so skip the check for that suite only.
        #
        # remove-omnibus is also excluded: kitchen-dokken's provisioner hardcodes
        # `chef_binary: /opt/chef/bin/chef-client` for every top-level `kitchen
        # converge` invocation (see vendor/gems/kitchen-dokken-*/lib/kitchen/
        # provisioner/dokken.rb), which is how the *first* converge legitimately
        # bootstraps against the base image's pre-baked omnibus chef-client. But
        # this suite's entire purpose is to delete /opt/chef by the end of that
        # first converge (see resources/remove_omnibus.rb) — a second top-level
        # `kitchen converge` has no omnibus binary left to bootstrap from and
        # fails immediately with "No such file or directory @ /opt/chef/bin/
        # chef-client". The suite's own `post_converge` lifecycle hook in
        # kitchen.yml already performs the genuinely separate second chef-client
        # run needed to complete the deferred removal, invoking the cookbook's
        # own stable binlink instead - that hook runs on every single `kitchen
        # converge`, so idempotency of the underlying resources is still
        # exercised, just not via a second top-level `kitchen converge`.
        if: matrix.suite != 'multi-version' && matrix.suite != 'remove-omnibus'
        run: |
          kitchen converge ${{ matrix.suite }}-${{ matrix.os }} 2>&1 | tee /tmp/second-converge.log
          if grep -qE '[1-9][0-9]*/[0-9]+ resources updated' /tmp/second-converge.log; then
            echo "::error::Second converge of ${{ matrix.suite }}-${{ matrix.os }} reported resource changes — cookbook is not idempotent"
            exit 1
          fi
      - name: Kitchen Verify
        run: |
          kitchen verify ${{ matrix.suite }}-${{ matrix.os }}
