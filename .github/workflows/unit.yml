---
"on":
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

env:
  HAB_LICENSE: accept-no-persist
  CHEF_LICENSE: accept-no-persist

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 3.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Install chefspec and habitat for unit testing
        run: |
          curl -sSfL "https://packages.chef.io/files/stable/habitat/latest/hab-x86_64-linux.tar.gz" -o "hab-x86_64-linux.tar.gz"
          tar -xzf "hab-x86_64-linux.tar.gz" -C "/bin" --strip-components=1
          gem install chefspec
          hab --version
      - name: Run RSpec
        run: rspec --format documentation --color
