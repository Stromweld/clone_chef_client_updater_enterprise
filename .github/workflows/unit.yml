---
"on":
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

env:
  HAB_LICENSE: accept-no-persist
  CHEF_LICENSE: accept-no-persist

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 3.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      # `hab` must exist on disk because spec/unit/resources/cleanup_spec.rb
      # exercises the real Helpers#hab_binary, which probes the filesystem and
      # returns nil when there is none.
      - name: Install chefspec and habitat for unit testing
        run: |
          curl -sSfL "https://packages.chef.io/files/stable/habitat/latest/hab-x86_64-linux.tar.gz" -o "$RUNNER_TEMP/hab-x86_64-linux.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/hab-x86_64-linux.tar.gz" -C /bin --strip-components=1 --wildcards '*/hab'
          gem install chefspec
          hab --version
      - name: Run RSpec
        run: rspec --format documentation --color
