---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  product_name: chef
  product_version: 18
  chef_license: accept-no-persist
  retry_on_exit_code:
    - 213
  max_retries: 1
  wait_for_retry: 1
  attributes:
    chef_client_updater_enterprise:
      license_key: <%= ENV.fetch('CHEF_LICENSE_KEY', nil) %>

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: almalinux-10
  - name: opensuse-leap-15
  - name: opensuse-leap-16
  - name: ubuntu-2404
  - name: ubuntu-2604
  - name: windows-2022
    driver:
      box: stromweld/windows-2022
      customize:
        memory: 4096
  - name: windows-11
    driver:
      box: stromweld/windows-11
      customize:
        memory: 4096

suites:
  - name: default
    verifier:
      inspec_tests:
        - test/integration/default
      inputs:
        expected_chef_ice_version: '19.3.15'
  - name: preserve-omnibus
    provisioner:
      named_run_list: preserve_omnibus
    verifier:
      inspec_tests:
        - test/integration/preserve-omnibus
      inputs:
        expected_chef_ice_version: '19.3.15'

  - name: remove-omnibus
    provisioner:
      named_run_list: remove_omnibus
    # remove_omnibus defers deletion while still running under the legacy omnibus
    # chef-client (see resources/remove_omnibus.rb); this hook performs the
    # genuinely separate second chef-client run needed to complete the removal,
    # invoking the cookbook's own stable binlink directly so it never resolves
    # back to the omnibus binary. See AGENTS.md "Omnibus Removal" for the full
    # rationale.
    lifecycle:
      post_converge:
        - remote: export TEST_KITCHEN=1; export IS_KITCHEN=true; sudo -E /usr/bin/chef-client --local-mode --config /tmp/kitchen/client.rb --json-attributes /tmp/kitchen/dna.json --no-color
          excludes:
            - windows-2022
        - remote: |
            C:\hab\bin\chef-client.bat --local-mode --config $env:TEMP\kitchen\client.rb --json-attributes $env:TEMP\kitchen\dna.json --no-color
          includes:
            - windows-2022
    verifier:
      inspec_tests:
        - test/integration/remove-omnibus
      inputs:
        expected_chef_ice_version: '19.3.15'

  - name: multi-version
    provisioner:
      named_run_list: multi_version

    verifier:
      inspec_tests:
        - test/integration/multi-version
      inputs:
        expected_chef_ice_version: '19.3.15'
        older_chef_ice_version: '19.2.12'

  - name: scheduler-fix
    provisioner:
      named_run_list: scheduler_fix
    verifier:
      inspec_tests:
        - test/integration/scheduler-fix
      inputs:
        expected_chef_ice_version: '19.3.15'
