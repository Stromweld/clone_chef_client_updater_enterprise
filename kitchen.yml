---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  product_name: chef
  product_version: "18"
  chef_license: accept-no-persist
  attributes:
    chef_client_updater_enterprise:
      license_key: <%= ENV.fetch('CHEF_LICENSE_KEY', nil) %>

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: almalinux-10
  - name: opensuse-leap-15
  - name: opensuse-leap-16
  - name: ubuntu-24.04
  - name: ubuntu-26.04
  - name: windows-2022
    driver:
      box: stromweld/windows-2022
      customize:
        memory: 4096
  - name: windows-11
    driver:
      box: stromweld/windows-11
      customize:
        memory: 4096

suites:
  - name: default
    verifier:
      inspec_tests:
        - test/integration/default
  - name: preserve-omnibus
    provisioner:
      named_run_list: preserve_omnibus
    verifier:
      inspec_tests:
        - test/integration/preserve-omnibus
  - name: remove-omnibus
    provisioner:
      named_run_list: remove_omnibus
    # Resource gates on not removing the omnibus if it's the currently running version of infra-client,
    # so we need to run the chef-client converge in a separate step after the main converge using the newly
    # installed version of chef-client to ensure the omnibus version is removed.
    lifecycle:
      post_converge:
        - remote: |
            sh -c 'export TEST_KITCHEN=1; export IS_KITCHEN=true; root=/tmp/kitchen; [ -f /opt/kitchen/client.rb ] && root=/opt/kitchen; /usr/bin/chef-client --local-mode --config "$root/client.rb" --json-attributes "$root/dna.json"'
          excludes:
            - windows-2022
            - windows-2025
            - windows-11
            - windows-latest
        - remote: |
            C:\hab\bin\chef-client.bat --local-mode --config $env:TEMP\kitchen\client.rb --json-attributes $env:TEMP\kitchen\dna.json
          includes:
            - windows-2022
            - windows-2025
            - windows-11
            - windows-latest
    verifier:
      inspec_tests:
        - test/integration/remove-omnibus
  - name: multi-version
    provisioner:
      named_run_list: multi_version

    verifier:
      inspec_tests:
        - test/integration/multi-version
      inputs:
        older_chef_ice_version: '19.2.12'
  - name: scheduler-fix
    provisioner:
      named_run_list: scheduler_fix
    verifier:
      inspec_tests:
        - test/integration/scheduler-fix
